<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5b33">
<title>Sora · Coches</title>
<style>
:root{
  --green:#0b5b33;--green2:#0c713d;--bg:#f3f6f4;--card:#fff;--text:#17221a;
  --muted:#718078;--line:#e1e8e3;--soft:#e8f4ec;--warn:#9c6500;--bad:#a83535;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);padding-bottom:42px}
button,input,select{font:inherit} button{cursor:pointer}
.topbar{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;padding:calc(20px + env(safe-area-inset-top)) 18px 28px;display:flex;justify-content:space-between;align-items:flex-start}
.eyebrow{font-size:11px;letter-spacing:.17em;font-weight:850;opacity:.82}
.topbar h1{font-size:27px;line-height:1.05;margin:8px 0 0}
.version{margin-top:8px;font-size:11px;font-weight:800;opacity:.8}
.iconbtn{border:0;background:transparent;color:white;font-size:30px;padding:2px 6px}
.wrap{max-width:760px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:21px;box-shadow:0 7px 24px rgba(16,59,34,.055)}
.summary{margin-top:-39px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.summary strong{display:block;font-size:20px}.summaryRight{text-align:right}
.muted{color:var(--muted);font-size:13px}
.sectionHead{display:flex;justify-content:space-between;align-items:center;margin:26px 4px 12px;gap:10px}
.sectionHead h2{margin:0;font-size:19px}.textbtn{border:0;background:transparent;color:var(--green2);font-weight:850;font-size:16px}
.list{display:grid;gap:11px}
.event{padding:15px}.eventTop{display:flex;gap:11px;align-items:flex-start}
.date{width:54px;min-width:54px;height:58px;border-radius:14px;background:var(--soft);display:grid;place-items:center;text-align:center;color:var(--green)}
.date span{display:block;font-size:10px;font-weight:900}.date b{display:block;font-size:20px;line-height:19px}
.eventInfo{flex:1}.eventInfo h3{margin:2px 0 4px;font-size:16px}.meta{font-size:13px;color:var(--muted)}
.status{white-space:nowrap;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900}
.ok{background:#dff2e5;color:#176838}.pending{background:#fff0d1;color:var(--warn)}.bad{background:#fbe2e2;color:var(--bad)}
.legs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.leg{border:1px solid var(--line);border-radius:14px;padding:10px}.leg small{display:block;color:var(--muted);font-size:10px;font-weight:850;margin-bottom:4px}.leg strong{font-size:13px}
.actions{display:flex;gap:8px;margin-top:10px}.pill{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 8px;font-size:13px;font-weight:800}.pill.primary{background:var(--green);border-color:var(--green);color:white}
.profile{padding:15px;display:flex;align-items:center;gap:12px}.avatar{width:44px;height:44px;min-width:44px;border-radius:50%;background:#e7f0ea;color:var(--green);display:grid;place-items:center;font-weight:900}
.profileMain{flex:1;min-width:0}.profileMain strong{display:block}.profileMain span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.chev{font-size:22px;color:var(--muted)}
.manageCard{padding:14px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.manageCard strong{display:block}.manageCard span{font-size:12px;color:var(--muted)}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#fff;border-radius:24px 24px 0 0;max-height:90vh;overflow:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -12px 38px rgba(0,0,0,.17)}
.hidden{display:none}.handle{width:44px;height:5px;border-radius:8px;background:#d6dcd8;margin:0 auto 16px}
.sheet h3{margin:0 0 5px;font-size:21px}.sheet p{margin:0 0 15px;color:var(--muted);font-size:13px}
.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:6px}
.field input,.field select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.save{width:100%;border:0;background:var(--green);color:#fff;border-radius:14px;padding:14px;font-weight:900;margin-top:10px}
.secondary{width:100%;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:14px;padding:13px;font-weight:850;margin-top:9px}
.danger{border-color:#efcaca;color:#a83535;background:#fff7f7}
.availRow,.familyRow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.availRow .profileMain,.familyRow .profileMain{min-width:0}
.allocation{padding-top:12px;margin-top:12px;border-top:1px solid var(--line)}
.carline{padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.45}
.notice{background:#fff7df;border:1px solid #f1dfaa;color:#76530b;border-radius:13px;padding:11px 12px;font-size:13px;margin:12px 0}
.info{background:#eef6f1;border:1px solid #d5e9dc;color:#315e41;border-radius:13px;padding:11px 12px;font-size:13px;margin:12px 0}
.closeX{float:right;border:0;background:#eef2ef;border-radius:999px;width:34px;height:34px;font-weight:900}
.empty{padding:22px;text-align:center;color:var(--muted)}
.smallbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:800}
.smallbtn.danger{color:#a83535;border-color:#efcccc}
@media(min-width:700px){.list.events{grid-template-columns:1fr 1fr}.sheet{max-width:620px;left:50%;transform:translateX(-50%);bottom:18px;border-radius:24px}}
</style>
</head>
<body>
<header class="topbar">
  <div>
    <div class="eyebrow">SORA · FÚTBOL</div>
    <h1>Coches</h1>
    <div class="version">V3 · FAMILIAS + FECHAS REALES</div>
  </div>
  <button id="resetBtn" class="iconbtn" aria-label="Reiniciar demo">↻</button>
</header>

<main class="wrap">
  <section class="summary card">
    <div><span class="muted">Próximos eventos</span><strong id="eventCount">0</strong></div>
    <div class="summaryRight"><strong id="coveredCount">0/0</strong><span class="muted">cubiertos</span></div>
  </section>

  <section>
    <div class="sectionHead"><h2>Próximos</h2><button id="addMatchBtn" class="textbtn">+ Partido</button></div>
    <div id="events" class="list events"></div>
  </section>

  <section>
    <div class="sectionHead"><h2>Mi familia</h2><button id="changeProfileBtn" class="textbtn">Cambiar</button></div>
    <div id="myFamily"></div>
  </section>

  <section>
    <div class="sectionHead"><h2>Equipo</h2></div>
    <div class="manageCard card" id="manageFamiliesBtn">
      <div><strong id="familyCount">Familias</strong><span>Añadir, editar o eliminar</span></div>
      <div class="chev">›</div>
    </div>
  </section>
</main>

<div id="backdrop" class="backdrop hidden"></div>
<aside id="sheet" class="sheet hidden" aria-hidden="true"><div class="handle"></div><div id="sheetContent"></div></aside>

<script>
(function(){
'use strict';

var STORAGE='sora-coches-v3';
var PROFILE='sora-coches-v3-profile';

var defaultFamilies=[
 {id:1,name:'Aimar',seats:5,score:8,availability:{}},
 {id:2,name:'Beñat',seats:7,score:5,availability:{}},
 {id:3,name:'Danel',seats:5,score:6,availability:{}},
 {id:4,name:'Ekain',seats:7,score:3,availability:{}},
 {id:5,name:'Eneko',seats:5,score:9,availability:{}},
 {id:6,name:'Hodei',seats:5,score:2,availability:{}},
 {id:7,name:'Iker',seats:7,score:7,availability:{}},
 {id:8,name:'Jon',seats:5,score:4,availability:{}}
];

function clone(o){return JSON.parse(JSON.stringify(o));}
function q(s){return document.querySelector(s);}
function pad(n){return String(n).padStart(2,'0');}
function dateKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function localDate(s,time){
  var p=s.split('-').map(Number), t=(time||'00:00').split(':').map(Number);
  return new Date(p[0],p[1]-1,p[2],t[0]||0,t[1]||0,0,0);
}
function dayLabel(d){return ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'][d.getDay()];}
function monthLabel(d){return ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'][d.getMonth()];}
function niceDate(d){return d.getDate()+' '+monthLabel(d).toLowerCase();}
function capacity(f){return Math.max(0,Number(f.seats)-1);}
function allows(mode,leg){return mode==='both'||mode===leg;}
function label(v){return {none:'No puedo',out:'Solo ida',back:'Solo vuelta',both:'Ida y vuelta'}[v]||'Sin indicar';}

var data;
try{data=JSON.parse(localStorage.getItem(STORAGE))||{families:clone(defaultFamilies),matches:[]};}
catch(e){data={families:clone(defaultFamilies),matches:[]};}
if(!Array.isArray(data.families)) data.families=clone(defaultFamilies);
if(!Array.isArray(data.matches)) data.matches=[];

function saveRaw(){try{localStorage.setItem(STORAGE,JSON.stringify(data));}catch(e){}}
function nextTrainingDates(){
  var now=new Date(), result=[], d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  for(var i=0;i<12 && result.length<6;i++){
    var dow=d.getDay();
    if(dow===1||dow===3||dow===5){
      var end=new Date(d.getFullYear(),d.getMonth(),d.getDate(),20,0);
      if(end>now){
        var id='train-'+dateKey(d);
        result.push({id:id,type:'training',date:dateKey(d),day:dayLabel(d),dayNum:d.getDate(),title:'Entrenamiento',time:'17:30',place:'Atxuri',kids:data.families.length});
      }
    }
    d.setDate(d.getDate()+1);
  }
  return result;
}
function currentEvents(){
  var now=new Date();
  data.matches=data.matches.filter(function(m){
    var end=localDate(m.date,m.time||'23:59');
    end.setHours(end.getHours()+4);
    return end>now;
  });
  saveRaw();
  var arr=nextTrainingDates().slice(0,3).concat(data.matches.map(function(m){
    var d=localDate(m.date,m.time);
    return {
      id:m.id,type:'match',date:m.date,day:dayLabel(d),dayNum:d.getDate(),
      title:'Partido'+(m.rival?' vs. '+m.rival:''),time:m.time||'—',place:m.place||'Campo por confirmar',
      kids:Number(m.kids)||data.families.length
    };
  }));
  arr.sort(function(a,b){return localDate(a.date,a.time)-localDate(b.date,b.time);});
  return arr;
}
function familyMode(f,eventId){return (f.availability||{})[eventId]||'none';}
function solve(ev,leg){
  var a=data.families.filter(function(f){return allows(familyMode(f,ev.id),leg);})
    .sort(function(x,y){return (x.score||0)-(y.score||0)||capacity(y)-capacity(x);});
  var need=Math.min(ev.kids,data.families.length),chosen=[];
  for(var i=0;i<a.length&&need>0;i++){chosen.push(a[i]);need-=capacity(a[i]);}
  return {chosen:chosen,missing:Math.max(0,need),capacity:chosen.reduce(function(n,f){return n+capacity(f);},0)};
}
function status(ev){
  var o=solve(ev,'out'),b=solve(ev,'back');
  if(!o.missing&&!b.missing)return['Cubierto','ok'];
  var m=Math.max(o.missing,b.missing);
  return['Faltan '+m+' plazas',m<5?'pending':'bad'];
}
function carsText(s){return s.missing?s.chosen.length+' coches · faltan '+s.missing:s.chosen.length+' coches · '+s.capacity+' plazas';}
function eventMeta(e){return e.time+' · '+e.place+' · '+e.kids+' niños';}
function myProfileId(){return Number(localStorage.getItem(PROFILE))||0;}
function setMyProfile(id){localStorage.setItem(PROFILE,String(id));render();}
function getMyFamily(){var id=myProfileId();return data.families.find(function(f){return f.id===id;})||null;}
function save(){saveRaw();render();}

function render(){
  var events=currentEvents(), ev=q('#events'); ev.innerHTML=''; var covered=0;
  if(!events.length){ev.innerHTML='<div class="card empty">No hay próximos eventos.</div>';}
  events.forEach(function(e){
    var st=status(e);if(st[1]==='ok')covered++;
    var out=solve(e,'out'),back=solve(e,'back'),a=document.createElement('article');
    a.className='event card';
    a.innerHTML=
      '<div class="eventTop">'+
        '<div class="date"><div><span>'+e.day+'</span><b>'+e.dayNum+'</b></div></div>'+
        '<div class="eventInfo"><h3>'+e.title+'</h3><div class="meta">'+eventMeta(e)+'</div></div>'+
        '<span class="status '+st[1]+'">'+st[0]+'</span>'+
      '</div>'+
      '<div class="legs"><div class="leg"><small>IDA</small><strong>'+carsText(out)+'</strong></div><div class="leg"><small>VUELTA</small><strong>'+carsText(back)+'</strong></div></div>'+
      '<div class="actions"><button class="pill" data-view="'+e.id+'">Ver reparto</button><button class="pill primary" data-event="'+e.id+'">Mi disponibilidad</button></div>';
    ev.appendChild(a);
  });
  q('#eventCount').textContent=events.length;
  q('#coveredCount').textContent=covered+'/'+events.length;
  q('#familyCount').textContent=data.families.length+' familias';

  var mine=getMyFamily(), box=q('#myFamily');
  if(!mine){
    box.innerHTML='<div class="manageCard card" id="chooseProfileCard"><div><strong>Selecciona tu familia</strong><span>Solo tendrás que hacerlo una vez en este móvil</span></div><div class="chev">›</div></div>';
  }else{
    box.innerHTML='<div class="profile card" data-myfamily="'+mine.id+'"><div class="avatar">'+mine.name.charAt(0).toUpperCase()+'</div><div class="profileMain"><strong>Familia '+mine.name+'</strong><span>Coche de '+mine.seats+' plazas · '+capacity(mine)+' niños</span></div><div class="chev">›</div></div>';
  }
}

function openSheet(html){
  q('#sheetContent').innerHTML='<button class="closeX" id="closeX">×</button>'+html;
  q('#sheet').classList.remove('hidden'); q('#backdrop').classList.remove('hidden');
  q('#sheet').setAttribute('aria-hidden','false'); q('#closeX').onclick=closeSheet;
}
function closeSheet(){
  q('#sheet').classList.add('hidden');q('#backdrop').classList.add('hidden');q('#sheet').setAttribute('aria-hidden','true');
}
function getEvent(id){return currentEvents().find(function(e){return e.id===id;});}

function chooseProfile(){
  var html='<h3>¿Cuál es tu familia?</h3><p>Este móvil recordará tu elección. No es un usuario con contraseña.</p>';
  if(!data.families.length) html+='<div class="empty">Primero añade una familia.</div>';
  data.families.forEach(function(f){
    html+='<div class="familyRow" data-pick-profile="'+f.id+'"><div class="avatar">'+f.name.charAt(0).toUpperCase()+'</div><div class="profileMain"><strong>Familia '+f.name+'</strong><span>Coche de '+f.seats+' plazas</span></div><div class="chev">›</div></div>';
  });
  openSheet(html);
}

function myAvailability(eventId){
  var f=getMyFamily();
  if(!f){chooseProfile();return;}
  var e=getEvent(eventId); if(!e)return;
  var cur=familyMode(f,e.id);
  openSheet('<h3>'+e.title+'</h3><p>'+e.day+' '+e.dayNum+' · '+eventMeta(e)+'</p>'+
    '<div class="field"><label>Familia '+f.name+'</label>'+
    '<select id="myAvail"><option value="none" '+(cur==='none'?'selected':'')+'>No puedo</option><option value="out" '+(cur==='out'?'selected':'')+'>Solo ida</option><option value="back" '+(cur==='back'?'selected':'')+'>Solo vuelta</option><option value="both" '+(cur==='both'?'selected':'')+'>Ida y vuelta</option></select></div>'+
    '<button class="save" id="saveMyAvail">Guardar disponibilidad</button>');
  q('#saveMyAvail').onclick=function(){
    f.availability=f.availability||{}; f.availability[e.id]=q('#myAvail').value; save(); closeSheet();
  };
}

function editMyFamily(){
  var f=getMyFamily(); if(!f){chooseProfile();return;}
  openSheet('<h3>Familia '+f.name+'</h3><p>Datos guardados solo en esta demo.</p>'+
    '<div class="field"><label>Nombre / jugador</label><input id="famName" value="'+escapeHtml(f.name)+'"></div>'+
    '<div class="field"><label>Plazas del coche</label><select id="famSeats"><option value="5" '+(f.seats===5?'selected':'')+'>5 plazas</option><option value="7" '+(f.seats===7?'selected':'')+'>7 plazas</option></select></div>'+
    '<button class="save" id="saveMine">Guardar cambios</button>'+
    '<button class="secondary" id="switchMine">Cambiar de familia en este móvil</button>');
  q('#saveMine').onclick=function(){f.name=q('#famName').value.trim()||f.name;f.seats=Number(q('#famSeats').value);save();closeSheet();};
  q('#switchMine').onclick=function(){closeSheet();setTimeout(chooseProfile,80);};
}

function manageFamilies(){
  var html='<h3>Familias del equipo</h3><p>Aquí se mantiene la lista completa. La portada solo muestra tu familia.</p>'+
    '<button class="save" id="addFamily">+ Añadir familia</button>';
  data.families.forEach(function(f){
    html+='<div class="familyRow"><div class="avatar">'+f.name.charAt(0).toUpperCase()+'</div><div class="profileMain"><strong>Familia '+escapeHtml(f.name)+'</strong><span>Coche '+f.seats+' plazas · '+(f.score||0)+' pts</span></div><button class="smallbtn" data-edit-family="'+f.id+'">Editar</button><button class="smallbtn danger" data-delete-family="'+f.id+'">Eliminar</button></div>';
  });
  html+='<div class="info">En una versión con usuarios reales, cada familia tendría su acceso y esta gestión quedaría solo para el coordinador.</div>';
  openSheet(html);
  q('#addFamily').onclick=addFamily;
}

function addFamily(){
  openSheet('<h3>Nueva familia</h3><p>Añade el nombre del jugador o el nombre que queráis usar.</p>'+
    '<div class="field"><label>Nombre / jugador</label><input id="newName" placeholder="Ej. Julen"></div>'+
    '<div class="field"><label>Plazas del coche</label><select id="newSeats"><option value="5">5 plazas</option><option value="7">7 plazas</option></select></div>'+
    '<button class="save" id="saveNewFamily">Añadir familia</button>');
  q('#saveNewFamily').onclick=function(){
    var name=q('#newName').value.trim(); if(!name){alert('Introduce un nombre.');return;}
    var next=data.families.reduce(function(m,f){return Math.max(m,f.id);},0)+1;
    data.families.push({id:next,name:name,seats:Number(q('#newSeats').value),score:0,availability:{}});
    save();closeSheet();
  };
}

function editFamily(id){
  var f=data.families.find(function(x){return x.id===id;}); if(!f)return;
  openSheet('<h3>Editar familia</h3>'+
    '<div class="field"><label>Nombre / jugador</label><input id="editName" value="'+escapeHtml(f.name)+'"></div>'+
    '<div class="field"><label>Plazas del coche</label><select id="editSeats"><option value="5" '+(f.seats===5?'selected':'')+'>5 plazas</option><option value="7" '+(f.seats===7?'selected':'')+'>7 plazas</option></select></div>'+
    '<button class="save" id="saveEditFamily">Guardar</button>');
  q('#saveEditFamily').onclick=function(){f.name=q('#editName').value.trim()||f.name;f.seats=Number(q('#editSeats').value);save();closeSheet();};
}
function deleteFamily(id){
  var f=data.families.find(function(x){return x.id===id;}); if(!f)return;
  if(!confirm('¿Eliminar a la familia '+f.name+'?'))return;
  data.families=data.families.filter(function(x){return x.id!==id;});
  if(myProfileId()===id)localStorage.removeItem(PROFILE);
  save();manageFamilies();
}

function allocation(id){
  var e=getEvent(id);if(!e)return;
  function leg(which,title){
    var s=solve(e,which),kids=data.families.slice(0,Math.min(e.kids,data.families.length)).map(function(f){return f.name;}),html='<div class="allocation"><strong>'+title+'</strong>';
    s.chosen.forEach(function(f){
      var ass=kids.splice(0,capacity(f));
      html+='<div class="carline"><strong>'+escapeHtml(f.name)+' · coche '+f.seats+' plazas</strong><br>'+(ass.length?ass.map(escapeHtml).join(', '):'—')+'</div>';
    });
    if(s.missing)html+='<div class="carline"><strong>⚠ Faltan '+s.missing+' plazas</strong></div>';
    return html+'</div>';
  }
  openSheet('<h3>'+e.title+'</h3><p>'+e.day+' '+e.dayNum+' · '+eventMeta(e)+'</p>'+leg('out','Ida')+leg('back','Vuelta'));
}

function addMatch(){
  var today=dateKey(new Date());
  openSheet('<h3>Añadir partido</h3><p>Fecha y hora quedan totalmente abiertas porque el partido se asigna cada semana.</p>'+
    '<div class="field"><label>Rival</label><input id="rival" placeholder="Ej. Bergara"></div>'+
    '<div class="grid2"><div class="field"><label>Fecha</label><input id="mdate" type="date" min="'+today+'"></div><div class="field"><label>Hora</label><input id="mtime" type="time"></div></div>'+
    '<div class="field"><label>Campo / lugar</label><input id="mplace" placeholder="Ej. Ezozia"></div>'+
    '<div class="field"><label>Jugadores convocados</label><input id="mkids" type="number" min="1" max="30" value="'+data.families.length+'"></div>'+
    '<button class="save" id="saveMatch">Guardar partido</button>');
  q('#saveMatch').onclick=function(){
    var date=q('#mdate').value,time=q('#mtime').value;
    if(!date||!time){alert('Indica fecha y hora del partido.');return;}
    var id='match-'+Date.now();
    data.matches.push({id:id,date:date,time:time,rival:q('#rival').value.trim(),place:q('#mplace').value.trim(),kids:Number(q('#mkids').value)||data.families.length});
    data.families.forEach(function(f){f.availability=f.availability||{};f.availability[id]='none';});
    save();closeSheet();
  };
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];});}

document.addEventListener('click',function(e){
  var v=e.target.closest('[data-view]');if(v){allocation(v.getAttribute('data-view'));return;}
  var ev=e.target.closest('[data-event]');if(ev){myAvailability(ev.getAttribute('data-event'));return;}
  var mine=e.target.closest('[data-myfamily]');if(mine){editMyFamily();return;}
  var pick=e.target.closest('[data-pick-profile]');if(pick){setMyProfile(Number(pick.getAttribute('data-pick-profile')));closeSheet();return;}
  var ef=e.target.closest('[data-edit-family]');if(ef){editFamily(Number(ef.getAttribute('data-edit-family')));return;}
  var df=e.target.closest('[data-delete-family]');if(df){deleteFamily(Number(df.getAttribute('data-delete-family')));return;}
  if(e.target.closest('#chooseProfileCard')){chooseProfile();return;}
});
q('#backdrop').onclick=closeSheet;
q('#addMatchBtn').onclick=addMatch;
q('#manageFamiliesBtn').onclick=manageFamilies;
q('#changeProfileBtn').onclick=chooseProfile;
q('#resetBtn').onclick=function(){
  if(confirm('¿Reiniciar todos los datos de la demo?')){
    data={families:clone(defaultFamilies),matches:[]};
    localStorage.removeItem(PROFILE);save();
  }
};
render();
})();
</script>
